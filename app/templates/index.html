<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="mb-4">📚 Gestion de la Bibliothèque</h1>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Tester une réservation (Simulation)</div>
                <div class="card-body">
                    <button onclick="reserver(1, 1)" class="btn btn-primary">Réserver le livre 1 (Lecteur 1)</button>
                    <button onclick="reserver(1, 2)" class="btn btn-danger mt-2">Tenter une double réservation</button>
                    <div id="message" class="mt-3 fw-bold"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function reserver(livreId, lecteurId) {
            const msgDiv = document.getElementById('message');
            try {
                const response = await fetch('/reservations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ livre_id: livreId, lecteur_id: lecteurId })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    msgDiv.className = "mt-3 fw-bold text-success";
                    msgDiv.innerText = "✅ Réservation réussie !";
                } else {
                    msgDiv.className = "mt-3 fw-bold text-danger";
                    msgDiv.innerText = "❌ Erreur " + response.status + " : " + data.detail;
                }
            } catch (e) {
                msgDiv.innerText = "Erreur réseau";
            }
        }
    </script>
</body>
</html>
